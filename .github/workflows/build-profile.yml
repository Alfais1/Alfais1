name: build profile

on:
  schedule:
    - cron: "17 3 * * *"        # nightly, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render SVGs
        run: node profile/build.mjs
        env:
          # PROFILE_TOKEN = classic PAT with `repo` + `read:user`, so private activity is counted.
          # Falls back to GITHUB_TOKEN, which only sees public data.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets profile/data.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh profile graphics [skip ci]"
          git push
